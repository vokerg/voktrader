name: T011 validation

on:
  push:
    branches:
      - task/T011-typed-entry-exit-intents

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Run T011 tests
        run: ./mvnw -B -ntp -Dtest=StrategyV2OrderActionBuilderTest,StrategyIntentBoundaryTest,StrategyExecutionBoundaryArchitectureTest test
      - name: Compile full test tree
        run: ./mvnw -B -ntp -DskipTests test
