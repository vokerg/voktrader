name: T042 inspection

on:
  pull_request:
    branches:
      - transformation/2.0
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory fee-related sources
        run: |
          echo '=== FILES ==='
          find . -maxdepth 6 -type f | sort
          echo '=== FEE REFERENCES ==='
          grep -RInE 'fee|Fee|FEES|taker|maker' --exclude-dir=.git . || true
