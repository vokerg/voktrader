name: CI

on:
  pull_request:
    branches:
      - main
      - transformation/2.0
  push:
    branches:
      - main
      - transformation/2.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
      - name: Run Java suite
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test
      - name: Upload Java test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-evidence
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            executor-python/pyproject.toml
            executor-python/requirements.lock
      - name: Install locked executor and test dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install --requirement executor-python/requirements.lock
          python -m pip install --no-deps --editable ./executor-python
          python -m pip check
      - name: Run executor tests
        run: python -m pytest -q executor-python/tests

  angular:
    name: Angular tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@11.12.1
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard tests
        run: npm test -- --watch=false
      - name: Build dashboard
        run: npm run build

  migrations:
    name: Clean PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: voktrader_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voktrader_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
      - name: Migrate a clean database
        env:
          VOKTRADER_MIGRATION_TEST: "true"
          VOKTRADER_MIGRATION_JDBC_URL: jdbc:postgresql://localhost:5432/voktrader_ci
          VOKTRADER_MIGRATION_DB_USER: postgres
          VOKTRADER_MIGRATION_DB_PASSWORD: postgres
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=CleanDatabaseMigrationTest test 2>&1 | tee migration-test.log
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-log
          path: migration-test.log
          if-no-files-found: ignore

  static:
    name: Static repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository hygiene and default tokens
        run: python scripts/ci/check_repository.py
      - name: Check dependency authorities
        run: python scripts/ci/check_dependency_locks.py
      - name: Test CI policy scripts
        run: python -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
      - name: Compile Python sources
        run: python -m compileall -q executor-python/voktrader_executor scripts/ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current repository tree
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.3
          detect --source=/repo --no-git --redact --exit-code=1
          --report-format=json --report-path=/repo/gitleaks-report.json
      - name: Upload secret scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  smoke:
    name: Java and executor compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and probe smoke environment
        run: |
          set -o pipefail
          bash scripts/ci/smoke-compose.sh 2>&1 | tee smoke-compose.log
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-compose-log
          path: smoke-compose.log
          if-no-files-found: ignore
