[project]
name = "voktrader-executor"
version = "0.3.0"
description = "Python Polymarket executor sidecar for voktrader"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.0",
  "uvicorn[standard]==0.52.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "py_clob_client_v2==1.1.0"
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1"
]

[project.scripts]
voktrader-executor = "voktrader_executor.main:run"
