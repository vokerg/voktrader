[project]
name = "voktrader-executor"
version = "0.3.0"
description = "Python Polymarket executor sidecar for voktrader"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "py_clob_client_v2>=1.0.0"
]

[project.scripts]
voktrader-executor = "voktrader_executor.main:run"
