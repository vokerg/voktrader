# Optimizer/backtest server profile.
#
# Keep this profile quiet and read-mostly: optimizer runs only need the HTTP
# backtest API and historical snapshots already stored in the database.
voktrader.bots.enabled=false
voktrader.resolution.poller.enabled=false
voktrader.order-layer.reconciliation.enabled=false

# Write optimizer JVM logs separately from live/paper bot runs.
logging.file.name=logs/voktrader-optimizer.log
