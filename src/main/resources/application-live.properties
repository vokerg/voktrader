# Live profile exposes live capability but starts unarmed. A profile activation alone
# must never be sufficient to submit a real entry order.
server.address=${VOKTRADER_LIVE_BIND_ADDRESS:127.0.0.1}
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.boot.admin.server.enabled=false

# Production schema authority is fail closed. Flyway must migrate and validate the
# database before Hibernate validates mappings; Hibernate may never create or alter
# live schema, and an existing non-Flyway schema is not silently baselined.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate

# Live operator surfaces use stateless bearer credentials with separate roles. Tokens
# have no defaults: missing, short, or duplicate values fail live startup closed.
voktrader.control-plane.read-only-token=${VOKTRADER_CONTROL_READ_ONLY_TOKEN}
voktrader.control-plane.operator-token=${VOKTRADER_CONTROL_OPERATOR_TOKEN}
voktrader.control-plane.admin-token=${VOKTRADER_CONTROL_ADMIN_TOKEN}
voktrader.control-plane.confirmation-token=${VOKTRADER_CONTROL_CONFIRMATION_TOKEN}

voktrader.trading.mode=LIVE
voktrader.trading.kill-switch-enabled=true
voktrader.trading.live-enabled=true
voktrader.trading.expected-account-id=${VOKTRADER_EXPECTED_ACCOUNT_ID:}
voktrader.trading.live-arm-ttl=${VOKTRADER_LIVE_ARM_TTL:15m}
voktrader.trading.max-order-usd=3.25
voktrader.trading.max-spread=0.075
voktrader.trading.max-price-age-ms=1200
voktrader.trading.min-seconds-to-expiry=55
voktrader.trading.min-maker-order-shares=5.00
voktrader.trading.max-open-live-trades=6
voktrader.trading.max-trades-per-market=1

# Python executor sidecar. Do not commit real tokens/secrets. The default token is
# reported as a live capability blocker and cannot be used to create a live arm.
voktrader.executor.enabled=true
voktrader.executor.dry-run=false
voktrader.executor.base-url=http://127.0.0.1:8099
voktrader.executor.api-token=${VOKTRADER_EXECUTOR_API_TOKEN:change-me}
voktrader.executor.timeout=10s
# Let each strategy choose FOK/FAK taker orders or GTC/GTD maker orders.
# Resting maker orders enter ENTRY_PENDING and are advanced by exchange reconciliation.
voktrader.executor.require-immediate-fill=false
voktrader.order-layer.enabled=true
voktrader.order-layer.reconciliation.enabled=true
voktrader.order-layer.reconciliation.interval-ms=2000
