# Live profile routes orders to the Python executor; without Polymarket auth
# data the sidecar rejects before touching the exchange.
voktrader.trading.mode=LIVE
voktrader.trading.kill-switch-enabled=false
voktrader.trading.live-enabled=true
voktrader.trading.max-order-usd=3.00
voktrader.trading.min-maker-order-shares=5.00
voktrader.trading.max-open-live-trades=6
voktrader.trading.max-trades-per-market=1

# Python executor sidecar. Do not commit real tokens/secrets.
voktrader.executor.enabled=true
voktrader.executor.dry-run=false
voktrader.executor.base-url=http://127.0.0.1:8099
voktrader.executor.api-token=${VOKTRADER_EXECUTOR_API_TOKEN:change-me}
voktrader.executor.timeout=10s
# Let each strategy choose FOK/FAK taker orders or GTC/GTD maker orders.
# Resting maker orders enter ENTRY_PENDING and are advanced by exchange reconciliation.
voktrader.executor.require-immediate-fill=false
voktrader.order-layer.enabled=true
voktrader.order-layer.reconciliation.enabled=true
voktrader.order-layer.reconciliation.interval-ms=2000
