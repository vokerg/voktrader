# Live profile guardrails. Enable deliberately, preferably first with dry-run=true.
voktrader.trading.mode=LIVE_TINY
voktrader.risk.enable-live-tiny=true
voktrader.risk.enable-live-full=false
voktrader.risk.global-kill-switch=false

# Python executor sidecar. Do not commit real tokens/secrets.
voktrader.executor.enabled=false
voktrader.executor.dry-run=true
voktrader.executor.base-url=http://127.0.0.1:8099
voktrader.executor.api-token=${VOKTRADER_EXECUTOR_API_TOKEN:change-me}
voktrader.executor.timeout=10s
voktrader.executor.require-immediate-fill=true
