spring.application.name=polymarket-paperbot

# H2 local file DB
spring.datasource.url=jdbc:h2:file:./data/voktrader;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

voktrader.market.expiry-grace-seconds=15
voktrader.resolution.poll-ms=30000
voktrader.resolution.grace-seconds=30
voktrader.resolution.max-markets-per-run=10

# Logging
logging.level.com.yourname.polymarketbot=INFO
logging.level.com.yourname.polymarketbot.polymarket.client=DEBUG
