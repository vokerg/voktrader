# GTG paper profile: keeps PAPER safety flags while matching the GTG risk envelope.
voktrader.trading.mode=PAPER
voktrader.trading.kill-switch-enabled=true
voktrader.trading.live-enabled=false
voktrader.trading.max-order-usd=3.25
voktrader.trading.max-spread=0.075
voktrader.trading.max-price-age-ms=1200
voktrader.trading.min-seconds-to-expiry=55
voktrader.trading.paper-fee-rate=0.072
voktrader.trading.maker-fee-rate=0
voktrader.trading.taker-fee-rate=0.072
voktrader.trading.allowed-strategy-ids=MK_GTD_EDGE_A

voktrader.executor.enabled=false
voktrader.executor.dry-run=true
voktrader.order-layer.enabled=true
voktrader.strategy-v2.execution.use-order-layer=true

voktrader.paper.execution.fill-model=maker_cross_pessimistic
voktrader.paper.execution.default-gtd-seconds=8
voktrader.paper.execution.allow-partial-fills=true
voktrader.paper.execution.maker-touch-fill-ratio=0.25
voktrader.paper.execution.advance-open-orders-on-book-update=true
