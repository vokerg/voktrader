polymarket.gamma-base-url=https://gamma-api.polymarket.com
polymarket.clob-base-url=https://clob.polymarket.com
polymarket.market-ws-url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.request-timeout-seconds=10

spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %highlight(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

voktrader.market.interval=5m
voktrader.market.min-seconds-remaining=60
voktrader.market.max-seconds-remaining=300
voktrader.market.expiry-grace-seconds=15
voktrader.resolution.poll-ms=30000
voktrader.resolution.grace-seconds=30
voktrader.resolution.max-markets-per-run=10

spring.datasource.url=jdbc:h2:file:./data/voktrader;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# Strategy runtime
# Active strategy ids:
# - cost-aware-momentum-paper
# - flip-catcher-reversal
voktrader.strategy.active=cost-aware-momentum-paper
# voktrader.strategy.active=flip-catcher-reversal
voktrader.strategy.tick-ms=1000

# Cost-aware momentum paper strategy.
voktrader.strategy.cost-aware-momentum.max-data-age-ms=2500
voktrader.strategy.cost-aware-momentum.max-spread=0.02
voktrader.strategy.cost-aware-momentum.min-mid=0.58
voktrader.strategy.cost-aware-momentum.max-entry-ask=0.68
voktrader.strategy.cost-aware-momentum.min-bid=0.54
voktrader.strategy.cost-aware-momentum.max-opposite-mid=0.43
voktrader.strategy.cost-aware-momentum.min-mid-move-10s=0.04
voktrader.strategy.cost-aware-momentum.min-bid-move-10s=0.03
voktrader.strategy.cost-aware-momentum.max-negative-move-3s=-0.005
voktrader.strategy.cost-aware-momentum.paper-size-usd=1.00
voktrader.strategy.cost-aware-momentum.min-profit-usd=0.10
voktrader.strategy.cost-aware-momentum.min-price-move=0.05
voktrader.strategy.cost-aware-momentum.max-loss-usd=0.15
voktrader.strategy.cost-aware-momentum.stop-mid=0.45
voktrader.strategy.cost-aware-momentum.min-hold-seconds=10
voktrader.strategy.cost-aware-momentum.trailing-stop-bid-drop=0.02
voktrader.strategy.cost-aware-momentum.force-decision-seconds=20
voktrader.strategy.cost-aware-momentum.closed-trade-cooldown-seconds=90
voktrader.strategy.cost-aware-momentum.max-trades-per-market=5

# Flip-catcher reversal strategy.
voktrader.strategy.flip-catcher.max-data-age-ms=2500
voktrader.strategy.flip-catcher.max-spread=0.02
voktrader.strategy.flip-catcher.min-candidate-mid=0.45
voktrader.strategy.flip-catcher.max-candidate-mid=0.55
voktrader.strategy.flip-catcher.max-entry-ask=0.56
voktrader.strategy.flip-catcher.min-candidate-mid-move-5s=0.035
voktrader.strategy.flip-catcher.min-candidate-bid-move-5s=0.025
voktrader.strategy.flip-catcher.max-opposite-mid-move-5s=-0.025
voktrader.strategy.flip-catcher.max-opposite-bid-move-5s=-0.015
voktrader.strategy.flip-catcher.max-negative-move-3s=-0.005
voktrader.strategy.flip-catcher.paper-size-usd=1.00
voktrader.strategy.flip-catcher.min-profit-usd=0.10
voktrader.strategy.flip-catcher.min-price-move=0.05
voktrader.strategy.flip-catcher.max-loss-usd=0.15
voktrader.strategy.flip-catcher.stop-mid=0.40
voktrader.strategy.flip-catcher.min-hold-seconds=8
voktrader.strategy.flip-catcher.trailing-stop-bid-drop=0.02
voktrader.strategy.flip-catcher.force-decision-seconds=20
voktrader.strategy.flip-catcher.closed-trade-cooldown-seconds=90
voktrader.strategy.flip-catcher.max-trades-per-market=5

# --- Voktrader trade execution model ---
# Safe defaults: PAPER mode only. LIVE_SHADOW records live-like orders but sends no real orders.
voktrader.trading.mode=PAPER
voktrader.trading.kill-switch-enabled=true
voktrader.trading.live-enabled=false
voktrader.trading.max-order-usd=1.00
voktrader.trading.max-spread=0.03
voktrader.trading.max-price-age-ms=1500
voktrader.trading.max-open-live-trades=6
voktrader.trading.max-trades-per-market=1
voktrader.trading.min-seconds-to-expiry=30
voktrader.trading.paper-fee-rate=0.072
voktrader.trading.taker-fee-rate=0.072
voktrader.trading.estimate-live-fees-when-missing=true
voktrader.trading.allowed-strategy-ids=cost-aware-momentum-paper,flip-catcher-reversal

