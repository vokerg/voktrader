polymarket.gamma-base-url=https://gamma-api.polymarket.com
polymarket.clob-base-url=https://clob.polymarket.com
polymarket.market-ws-url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.request-timeout-seconds=10

spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %highlight(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

voktrader.market.interval=5m
voktrader.market.min-seconds-remaining=60
voktrader.market.max-seconds-remaining=300

spring.datasource.url=jdbc:h2:file:./data/voktrader;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# Strategy engine
# Available ids:
# - simple-down-cheap-tight-spread
# - buy-sell-smoke
voktrader.strategy.active=buy-sell-smoke
# voktrader.strategy.active=simple-down-cheap-tight-spread
voktrader.strategy.tick-ms=1000

# Original strategy settings
voktrader.strategy.simple-down-cheap-tight-spread.max-ask=0.25
voktrader.strategy.simple-down-cheap-tight-spread.max-spread=0.03
voktrader.strategy.simple-down-cheap-tight-spread.fake-size-usd=1.00

# Smoke-test strategy for fake buy -> fake sell.
voktrader.strategy.buy-sell-smoke.buy-outcome=ANY
voktrader.strategy.buy-sell-smoke.buy-below-ask=0.25
voktrader.strategy.buy-sell-smoke.buy-above-ask=0.75
voktrader.strategy.buy-sell-smoke.max-spread=0.03
voktrader.strategy.buy-sell-smoke.fake-size-usd=1.00
voktrader.strategy.buy-sell-smoke.min-profit-usd=0.00000001
