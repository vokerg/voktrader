polymarket.gamma-base-url=https://gamma-api.polymarket.com
polymarket.clob-base-url=https://clob.polymarket.com
polymarket.market-ws-url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.request-timeout-seconds=10

spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false

voktrader.market.interval=15m
voktrader.market.min-seconds-remaining=300
voktrader.market.max-seconds-remaining=720

spring.datasource.url=jdbc:h2:mem:voktrader
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false