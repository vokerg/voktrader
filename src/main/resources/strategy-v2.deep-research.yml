        - feature: candidate.mid_move_5s
          op: '>='
          value: '0.010'
        - feature: candidate.bid_move_3s
          op: '>='
          value: '0.005'
        - feature: opposite.mid_move_5s
          op: <=
          value: '-0.006'
        - feature: opposite.bid_move_5s
          op: <=
          value: '-0.004'
        - feature: candidate.microprice_edge
          op: '>='
          value: '0.003'
        - feature: candidate.depth_imbalance_0_03
          op: '>='
          value: '0.050'
        - feature: candidate.volatility_10s
          op: <=
          value: '0.050'
      action:
        side: BUY
        liquidity-role: taker
        order-type: FOK
        post-only: false
        price:
          source: best_ask
          tick-size: '0.01'
          rounding: none
          min-price: '0.08'
          max-price: '0.80'
        size:
          type: fixed_usd
          paper-usd: '1.00'
          min-usd: '1.00'
          max-usd: '1.00'
        fill-constraints:
          allow-partial-fill: false
          min-fill-ratio: '1.0'
          max-slippage: '0.009'
