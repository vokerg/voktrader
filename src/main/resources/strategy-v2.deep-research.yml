          expression: (candidate.mid_move_5s - opposite.mid_move_5s) * 1.7 + candidate.bid_move_3s * 1.1 + candidate.microprice_edge * 0.8 + candidate.depth_imbalance_0_03 * 0.05 - candidate.spread * 1.0 - candidate.volatility_10s * 0.6
        Down:
          expression: (candidate.mid_move_5s - opposite.mid_move_5s) * 1.7 + candidate.bid_move_3s * 1.1 + candidate.microprice_edge * 0.8 + candidate.depth_imbalance_0_03 * 0.05 - candidate.spread * 1.0 - candidate.volatility_10s * 0.6
    entry:
