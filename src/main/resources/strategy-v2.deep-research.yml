  - strategy-id: MK_GTC_B
    enabled: false
    profile: deep_research_paper
    description: Passive maker fee-edge GTC
    hypothesis: Rest at bid only when the book is stable enough that spread capture and zero maker fee may outweigh missed fills.
    tags:
    - deep-research
    - maker
    - passive
    - fee-edge
    - paper
    - disabled
    allowed-execution-modes:
    - PAPER
    candidate-selection:
      type: score
      candidates:
      - Up
      - Down
      choose: highest_score
      min-score: '0.012'
      score:
        Up:
          expression: (candidate.microprice_edge * 1.0) + (candidate.depth_imbalance_0_03 * 0.05) - (candidate.volatility_10s * 0.8) - (candidate.spread * 0.5)
        Down:
          expression: (candidate.microprice_edge * 1.0) + (candidate.depth_imbalance_0_03 * 0.05) - (candidate.volatility_10s * 0.8) - (candidate.spread * 0.5)
    entry:
      enabled: true
      rule-id: mk-gtc-b-entry
      when:
        all:
        - feature: market.accepting_orders
          op: ==
          value: true
        - feature: market.seconds_to_expiry
          op: between
          values:
          - '70'
          - '240'
        - feature: candidate.mid
          op: between
          values:
          - '0.35'
          - '0.68'
        - feature: candidate.spread
          op: between
          values:
          - '0.010'
          - '0.030'
        - feature: candidate.price_age_ms
          op: <=
          value: '1000'
        - feature: candidate.book_age_ms
          op: <=
          value: '1000'
        - feature: candidate.microprice_edge
          op: '>='
          value: '0.002'
        - feature: candidate.depth_imbalance_0_03
          op: '>='
          value: '0.030'
        - feature: candidate.mid_move_5s
          op: between
          values:
          - '-0.005'
          - '0.015'
        - feature: candidate.volatility_10s
          op: <=
          value: '0.025'
      action:
        side: BUY
        liquidity-role: maker
        order-type: GTC
        post-only: true
        price:
          source: best_bid
          tick-size: '0.01'
          rounding: none
          min-price: '0.05'
          max-price: '0.80'
          do-not-cross-spread: true
        size:
          type: fixed_usd
          paper-usd: '1.00'
          min-usd: '1.00'
          max-usd: '1.00'
        maker-lifecycle:
          cancel-after-seconds: 6
          replace-if-best-bid-moves-ticks: 1
          max-reposts: 1
          require-reconciliation: true
        reason-template: MK_GTC_B {{candidate.outcome}}
    exit:
      enabled: true
      rule-id: mk-gtc-b-exit
      default-action: HOLD
      rules:
      - name: maker-position-breaks
        action: SELL
        order-type: FAK
        liquidity-role: taker
        when:
          any:
          - feature: candidate.microprice_edge
            op: <=
            value: '-0.001'
          - feature: candidate.depth_imbalance_0_03
            op: <=
            value: '-0.040'
          - feature: market.seconds_to_expiry
            op: <=
            value: '18'
    simulation:
      fill-model: maker_queue_pessimistic
      fee-model: configured
      taker-fee-rate: '0.072'
      maker-fee-rate: '0'
    diagnostics:
      record-rejections: true
      record-feature-snapshot-on-entry: true
      record-candidate-scores: true
    entry-order-management:
      max-pending-seconds: 6
      cancel-if-signal-invalid: true
      cancel-if-book-stale: true
      cancel-if-price-moves-away: true
      allow-reprice: false
