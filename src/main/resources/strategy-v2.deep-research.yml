          - feature: candidate.mid_move_5s
            op: <=
            value: '-0.008'
          - feature: opposite.mid_move_5s
            op: '>='
            value: '0.004'
      - name: final-flush
        action: SELL
        order-type: FAK
        liquidity-role: taker
        when:
          feature: market.seconds_to_expiry
          op: <=
