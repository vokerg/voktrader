    candidate-selection:
      type: score
      candidates:
      - Up
      - Down
      choose: highest_score
      min-score: '0.022'
      score:
        Up:
          expression: (candidate.microprice_edge * 1.6) + (candidate.depth_imbalance_0_03 * 0.10) + (candidate.bid_move_3s * 0.9) + (candidate.mid_move_5s * 0.6) - (candidate.spread * 1.2) - (candidate.volatility_10s * 0.7)
        Down:
          expression: (candidate.microprice_edge * 1.6) + (candidate.depth_imbalance_0_03 * 0.10) + (candidate.bid_move_3s * 0.9) + (candidate.mid_move_5s * 0.6) - (candidate.spread * 1.2) - (candidate.volatility_10s * 0.7)
    entry:
      enabled: true
      rule-id: mdi-fok-a-entry
      when:
        all:
        - feature: market.accepting_orders
          op: ==
          value: true
        - feature: market.seconds_to_expiry
          op: between
          values:
          - '50'
          - '240'
        - feature: candidate.mid
          op: between
          values:
          - '0.30'
          - '0.72'
        - feature: candidate.price_age_ms
          op: <=
          value: '1000'
        - feature: candidate.book_age_ms
          op: <=
          value: '1000'
        - feature: candidate.spread
          op: <=
          value: '0.015'
        - feature: candidate.taker_buy.fillable
          op: ==
          value: true
        - feature: candidate.taker_buy.slippage
          op: <=
          value: '0.008'
        - feature: candidate.microprice_edge
          op: '>='
          value: '0.006'
        - feature: candidate.depth_imbalance_0_03
          op: '>='
          value: '0.180'
        - feature: candidate.bid_depth_within_0_03
          op: '>='
          value: '10.0'
        - feature: candidate.bid_move_3s
          op: '>='
          value: '0.001'
        - feature: candidate.volatility_10s
          op: <=
          value: '0.035'
      action:
        side: BUY
        liquidity-role: taker
        order-type: FOK
        post-only: false
        price:
          source: best_ask
          tick-size: '0.01'
          rounding: none
          min-price: '0.05'
          max-price: '0.80'
        size:
          type: fixed_usd
          paper-usd: '1.00'
          min-usd: '1.00'
          max-usd: '1.00'
        fill-constraints:
          allow-partial-fill: false
          min-fill-ratio: '1.0'
          max-slippage: '0.008'
        reason-template: MDI_FOK_A {{candidate.outcome}}
    exit:
      enabled: true
      rule-id: mdi-fok-a-exit
      default-action: HOLD
      rules:
      - name: book-pressure-vanishes
        action: SELL
        order-type: FAK
        liquidity-role: taker
        when:
          any:
          - feature: candidate.microprice_edge
            op: <=
            value: '0.000'
          - feature: candidate.depth_imbalance_0_03
            op: <=
            value: '0.000'
      - name: final-flush
        action: SELL
        order-type: FAK
        liquidity-role: taker
        when:
          feature: market.seconds_to_expiry
          op: <=
          value: '18'
    simulation:
      fill-model: taker_book_walk
      fee-model: configured
      taker-fee-rate: '0.072'
      maker-fee-rate: '0'
    diagnostics:
      record-rejections: true
      record-feature-snapshot-on-entry: true
      record-candidate-scores: true
  - strategy-id: FLIP_FOK_A
    enabled: true
    profile: deep_research_paper
    description: Flip catcher FOK
    hypothesis: Buy the side leaving the 50/50 zone while the opposite side weakens.
    tags:
    - deep-research
    - flip
    - reversal
    - fok
    - paper
