        Down:
          expression: (candidate.mid_edge - candidate.taker_buy.slippage - ((candidate.taker_buy.fee_usd / max(candidate.taker_buy.shares, 1)) * 2)) * 1.7 + candidate.mid_move_5s * 1.4 + candidate.bid_move_3s * 1.2 + candidate.depth_imbalance_0_03 * 0.06 + candidate.microprice_edge * 0.8 - candidate.spread * 1.1 - (market.seconds_to_expiry * 0.00003)
