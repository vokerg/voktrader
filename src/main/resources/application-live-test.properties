# Extra guardrails for the small Strategy V2 live smoke test.
#
# Use together with the live profile, for example:
#   --spring.profiles.active=live,live-test
#
# Current live-test Strategy V2 bots:
#   10 = BTC_5M
#   44 = ETH_5M
#   46 = SOL_5M
voktrader.bots.include-ids=10,44,46
voktrader.trading.max-open-live-trades=3
voktrader.trading.max-trades-per-market=3
voktrader.trading.live-retry-cooldown-seconds=5
voktrader.strategy-v2.diagnostics.entry-pulse-enabled=true
voktrader.strategy-v2.diagnostics.entry-pulse-seconds=30

# Show ENTRY_REJECTED reasons while the live test is intentionally tiny.
# logging.level.voktrader.events=DEBUG
